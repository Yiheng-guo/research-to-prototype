<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>询价前先澄清 · 合成原型</title>
<style>body{font-family:system-ui;background:#eef2f2;color:#183338;margin:0}main{max-width:640px;margin:40px auto;padding:28px;background:white;border-radius:20px}label{display:block;margin:16px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #718c92;border-radius:8px;font:inherit}button{padding:12px 24px;background:#18695f;color:white;border:0;border-radius:8px;font:inherit}#error{color:#a32323}#result{padding:16px;background:#e7f5ec;margin-top:20px}small{color:#40565c}@media(max-width:680px){main{margin:12px;padding:20px}}</style>
<main><small>合成数据 · 本地交互原型 · 未连接销售或报价系统</small><h1>询价前，先说明你的需求</h1><p>完整信息可减少反复沟通。价格需要销售确认。</p><form id="form" novalidate><label for="region">地域</label><input id="region" required placeholder="例如：上海"><label for="spec">材料规格</label><input id="spec" required placeholder="例如：A规格"><label for="quantity">数量</label><input id="quantity" type="number" min="1" required><p id="error" role="alert"></p><button type="submit">生成待确认摘要</button></form><section id="result" hidden aria-live="polite"><h2>需求摘要</h2><p id="summary"></p><p>待销售确认，当前不提供价格。本原型不会发送信息。</p><button id="edit" type="button">修改信息</button></section></main>
<script>const form=document.querySelector('#form'),result=document.querySelector('#result'),error=document.querySelector('#error');form.addEventListener('submit',e=>{e.preventDefault();const region=document.querySelector('#region').value.trim(),spec=document.querySelector('#spec').value.trim(),q=Number(document.querySelector('#quantity').value);if(!region||!spec||!Number.isFinite(q)||q<=0){error.textContent='请填写地域、材料规格和大于0的数量。';return;}error.textContent='';document.querySelector('#summary').textContent=`地域：${region}；规格：${spec}；数量：${q}。`;result.hidden=false;form.hidden=true;});document.querySelector('#edit').addEventListener('click',()=>{result.hidden=true;form.hidden=false;document.querySelector('#region').focus()});</script></html>
